<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图标生成器</title>
  <style>
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 40px 20px;
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
      background: #f8fafc;
    }
    h2 { color: #1e293b; margin-bottom: 8px; }
    p { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
    button {
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px;
    }
    button:hover { background: #4338ca; }
    button:active { transform: scale(0.97); }
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .preview img {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: white;
    }
    #status {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    .success { background: #dcfce7; color: #16a34a; display: block; }
  </style>
</head>
<body>
  <h2>📦 生成 PWA 图标</h2>
  <p>点击按钮生成各尺寸的图标，然后保存到 <code>icons/</code> 目录下</p>

  <div id="preview" class="preview"></div>

  <button onclick="generateAll()">🎨 生成全部图标</button>
  <button onclick="downloadAll()">⬇️ 一键下载全部</button>

  <div id="status"></div>

  <p style="margin-top:24px; font-size:0.8rem; color:#94a3b8;">
    需要 8 个尺寸：72, 96, 128, 144, 152, 192, 384, 512
  </p>

  <script src="generate.js"></script>
</body>
</html>
