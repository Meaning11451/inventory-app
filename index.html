<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="进销存">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
  <title>进销存</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- 离线提示 -->
  <div id="offlineBanner" class="offline-banner">⚠️ 当前处于离线状态，操作将在恢复网络后自动同步</div>

  <!-- 顶栏 -->
  <header class="app-header">
    <h1 id="headerTitle">进销存</h1>
    <div class="header-actions">
      <span id="syncStatus" class="sync-status online" title="同步状态">🟢 在线</span>
    </div>
  </header>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- 主内容 -->
  <main class="main-content">

    <!-- ==================== 📊 首页仪表盘 ==================== -->
    <section id="page-dashboard" class="tab-page active">
      <!-- 统计卡片 -->
      <div id="dashboardStats" class="stats-grid">
        <div class="stat-card stat-products">
          <div class="stat-icon">📦</div>
          <div class="stat-num" id="statProductCount">--</div>
          <div class="stat-label">商品总数</div>
        </div>
        <div class="stat-card stat-customers">
          <div class="stat-icon">👥</div>
          <div class="stat-num" id="statCustomerCount">--</div>
          <div class="stat-label">客户总数</div>
        </div>
        <div class="stat-card stat-inbound">
          <div class="stat-icon">📥</div>
          <div class="stat-num" id="statTodayIn">--</div>
          <div class="stat-label">今日入库</div>
        </div>
        <div class="stat-card stat-outbound">
          <div class="stat-icon">📤</div>
          <div class="stat-num" id="statTodayOut">--</div>
          <div class="stat-label">今日出库</div>
        </div>
      </div>

      <!-- 快捷操作 -->
      <div class="quick-actions">
        <button class="btn btn-success" onclick="document.querySelector('[data-tab=inbound]').click()">
          📥 入库
        </button>
        <button class="btn btn-danger" onclick="document.querySelector('[data-tab=outbound]').click()">
          📤 出库
        </button>
        <button class="btn btn-outline" onclick="document.querySelector('[data-tab=customers]').click()">
          👥 客户
        </button>
      </div>

      <!-- 低库存预警 -->
      <div class="section-title">⚠️ 低库存预警</div>
      <div id="dashboardLowStock"></div>

      <!-- 最近记录 -->
      <div class="section-title">🕐 最近操作</div>
      <div id="dashboardRecent"></div>
    </section>

    <!-- ==================== 📦 库存 ==================== -->
    <section id="page-stock" class="tab-page">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <div class="search-bar" style="flex:1;margin-bottom:0;">
          <span class="search-icon">🔍</span>
          <input type="text" id="stockSearch" placeholder="搜索商品..." autocomplete="off">
        </div>
        <button id="btnAddProduct" class="btn btn-primary" style="flex-shrink:0;padding:10px 14px;">＋ 添加</button>
      </div>
      <div id="stockList"></div>
    </section>

    <!-- ==================== 📥 入库 ==================== -->
    <section id="page-inbound" class="tab-page">
      <div class="segmented-control">
        <button id="inboundModeForm" class="active">📝 表单</button>
        <button id="inboundModeQuick">⚡ 快捷</button>
        <button id="inboundModeExcel">📊 Excel</button>
      </div>

      <!-- 表单 -->
      <div id="inboundFormMode">
        <form id="inboundForm">
          <div class="form-row">
            <div class="form-group" style="flex:1.5;">
              <label class="form-label">商品 *</label>
              <select id="inboundProduct" class="form-select" required></select>
            </div>
            <div class="form-group" style="flex:1.2;">
              <label class="form-label">客户</label>
              <select id="inboundCustomer" class="form-select"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">数量 *</label>
              <input type="number" id="inboundQty" class="form-input" placeholder="数量" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label">单价</label>
              <input type="number" id="inboundPrice" class="form-input" placeholder="¥" step="0.01" min="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">日期</label>
              <input type="date" id="inboundDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">备注</label>
              <input type="text" id="inboundNote" class="form-input" placeholder="备注">
            </div>
          </div>
          <button type="submit" class="btn btn-success btn-block">📥 确认入库</button>
        </form>
      </div>

      <!-- 快捷 -->
      <div id="inboundQuickMode" style="display:none;">
        <div class="form-group">
          <label class="form-label">粘贴内容（客户名单独一行，下面列商品）</label>
          <textarea id="inboundQuickText" class="form-textarea" placeholder="冬盼&#10;后腿卷 10件&#10;三号 8件&#10;乌鸡卷 3件&#10;&#10;李四&#10;五花肉 5斤&#10;排骨 3件"></textarea>
        </div>
        <button id="inboundQuickParse" class="btn btn-outline btn-block">🔍 解析预览</button>
        <div id="inboundParsePreview"></div>
        <button id="inboundQuickSubmit" class="btn btn-success btn-block" style="display:none;margin-top:12px;">📥 确认批量入库</button>
      </div>

      <!-- Excel -->
      <div id="inboundExcelMode" style="display:none;">
        <div class="form-group">
          <label class="form-label">选择 Excel 文件</label>
          <input type="file" id="inboundExcelFile" class="form-input" accept=".xlsx,.xls">
          <p class="form-hint">列顺序：客户名 | 商品名 | 数量 | 单位 | 单价。第一行为标题会自动跳过。</p>
        </div>
        <div id="inboundExcelPreview"></div>
        <button id="inboundExcelSubmit" class="btn btn-success btn-block" style="display:none;margin-top:12px;">📥 确认导入</button>
      </div>
    </section>

    <!-- ==================== 📤 出库 ==================== -->
    <section id="page-outbound" class="tab-page">
      <div class="segmented-control">
        <button id="outboundModeForm" class="active">📝 表单</button>
        <button id="outboundModeQuick">⚡ 快捷</button>
        <button id="outboundModeExcel">📊 Excel</button>
      </div>

      <div id="outboundFormMode">
        <form id="outboundForm">
          <div class="form-row">
            <div class="form-group" style="flex:1.5;">
              <label class="form-label">商品 *</label>
              <select id="outboundProduct" class="form-select" required></select>
            </div>
            <div class="form-group" style="flex:1.2;">
              <label class="form-label">客户</label>
              <select id="outboundCustomer" class="form-select"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">数量 *</label>
              <input type="number" id="outboundQty" class="form-input" placeholder="数量" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label">单价</label>
              <input type="number" id="outboundPrice" class="form-input" placeholder="¥" step="0.01" min="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">日期</label>
              <input type="date" id="outboundDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">备注</label>
              <input type="text" id="outboundNote" class="form-input" placeholder="备注">
            </div>
          </div>
          <button type="submit" class="btn btn-danger btn-block">📤 确认出库</button>
        </form>
      </div>

      <div id="outboundQuickMode" style="display:none;">
        <div class="form-group">
          <label class="form-label">粘贴内容（客户名单独一行，下面列商品）</label>
          <textarea id="outboundQuickText" class="form-textarea" placeholder="冬盼&#10;后腿卷 10件&#10;三号 8件&#10;乌鸡卷 3件&#10;&#10;李四&#10;五花肉 5斤&#10;排骨 3件"></textarea>
        </div>
        <button id="outboundQuickParse" class="btn btn-outline btn-block">🔍 解析预览</button>
        <div id="outboundParsePreview"></div>
        <button id="outboundQuickSubmit" class="btn btn-danger btn-block" style="display:none;margin-top:12px;">📤 确认批量出库</button>
      </div>

      <div id="outboundExcelMode" style="display:none;">
        <div class="form-group">
          <label class="form-label">选择 Excel 文件</label>
          <input type="file" id="outboundExcelFile" class="form-input" accept=".xlsx,.xls">
          <p class="form-hint">列顺序：客户名 | 商品名 | 数量 | 单位 | 单价</p>
        </div>
        <div id="outboundExcelPreview"></div>
        <button id="outboundExcelSubmit" class="btn btn-danger btn-block" style="display:none;margin-top:12px;">📤 确认导入</button>
      </div>
    </section>

    <!-- ==================== 👥 客户 ==================== -->
    <section id="page-customers" class="tab-page">
      <div class="segmented-control">
        <button id="customerModeForm" class="active">📝 表单</button>
        <button id="customerModeQuick">⚡ 快捷</button>
        <button id="customerModeExcel">📊 Excel</button>
      </div>

      <!-- 表单模式 -->
      <div id="customerFormMode">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <div class="search-bar" style="flex:1;margin-bottom:0;">
            <span class="search-icon">🔍</span>
            <input type="text" id="customerSearch" placeholder="搜索客户..." autocomplete="off">
          </div>
          <button id="btnAddCustomer" class="btn btn-primary" style="flex-shrink:0;padding:10px 14px;">＋ 添加</button>
        </div>
        <div id="customerList"></div>
      </div>

      <!-- 快捷模式 -->
      <div id="customerQuickMode" style="display:none;">
        <div class="form-group">
          <label class="form-label">粘贴内容（每行：客户名 电话 备注）</label>
          <textarea id="customerQuickText" class="form-textarea" placeholder="张三 13800138000&#10;李四 13900139000 老客户&#10;王五"></textarea>
        </div>
        <button id="customerQuickParse" class="btn btn-outline btn-block">🔍 解析预览</button>
        <div id="customerParsePreview"></div>
        <button id="customerQuickSubmit" class="btn btn-primary btn-block" style="display:none;margin-top:12px;">👥 确认批量添加</button>
      </div>

      <!-- Excel 模式 -->
      <div id="customerExcelMode" style="display:none;">
        <div class="form-group">
          <label class="form-label">选择 Excel 文件</label>
          <input type="file" id="customerExcelFile" class="form-input" accept=".xlsx,.xls">
          <p class="form-hint">列顺序：客户名 | 电话 | 备注。第一行为标题会自动跳过。</p>
        </div>
        <div id="customerExcelPreview"></div>
        <button id="customerExcelSubmit" class="btn btn-primary btn-block" style="display:none;margin-top:12px;">👥 确认导入</button>
      </div>
    </section>

    <!-- ==================== 📋 记录 ==================== -->
    <section id="page-records" class="tab-page">
      <div class="form-group">
        <select id="recordTypeFilter" class="form-select">
          <option value="inbound">📥 入库记录</option>
          <option value="outbound">📤 出库记录</option>
        </select>
      </div>
      <div class="filter-row">
        <input type="date" id="recordFromDate" class="form-input" placeholder="开始日期">
        <input type="date" id="recordToDate" class="form-input" placeholder="结束日期">
      </div>
      <div class="form-group">
        <select id="recordCustomerFilter" class="form-select">
          <option value="">全部客户</option>
        </select>
      </div>
      <div id="recordList"></div>
    </section>

  </main>

  <!-- 底部导航 -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="dashboard">
      <span class="tab-icon">📊</span>首页
    </button>
    <button class="tab-item" data-tab="stock">
      <span class="tab-icon">📦</span>库存
    </button>
    <button class="tab-item" data-tab="inbound">
      <span class="tab-icon">📥</span>入库
    </button>
    <button class="tab-item" data-tab="outbound">
      <span class="tab-icon">📤</span>出库
    </button>
    <button class="tab-item" data-tab="customers">
      <span class="tab-icon">👥</span>客户
    </button>
    <button class="tab-item" data-tab="records">
      <span class="tab-icon">📋</span>记录
    </button>
  </nav>

  <!-- ========== 商品编辑弹窗 ========== -->
  <div id="productModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-sheet">
      <h3 id="productModalTitle">添加商品</h3>
      <div class="form-group"><label class="form-label">商品名称 *</label><input type="text" id="productModalName" class="form-input" placeholder="例如：后腿卷"></div>
      <div class="form-group"><label class="form-label">规格</label><input type="text" id="productModalSpec" class="form-input" placeholder="例如：大号 / 2.5kg/袋"></div>
      <div class="form-group"><label class="form-label">单位</label><input type="text" id="productModalUnit" class="form-input" placeholder="件" value="件"></div>
      <div class="modal-actions">
        <button id="productModalCancel" class="btn btn-outline">取消</button>
        <button id="productModalSave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ========== 客户编辑弹窗 ========== -->
  <div id="customerModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-sheet">
      <h3 id="customerModalTitle">添加客户</h3>
      <div class="form-group"><label class="form-label">客户名称 *</label><input type="text" id="customerModalName" class="form-input" placeholder="例如：张三"></div>
      <div class="form-group"><label class="form-label">电话</label><input type="text" id="customerModalPhone" class="form-input" placeholder="手机号"></div>
      <div class="form-group"><label class="form-label">备注</label><input type="text" id="customerModalNote" class="form-input" placeholder="备注"></div>
      <div class="modal-actions">
        <button id="customerModalCancel" class="btn btn-outline">取消</button>
        <button id="customerModalSave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ========== 入库快捷录入弹窗（商品详情快捷操作） ========== -->
  <div id="quickInModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-sheet">
      <h3 id="quickInTitle">快捷入库</h3>
      <div class="form-group"><label class="form-label">数量</label><input type="number" id="quickInQty" class="form-input" placeholder="数量" step="0.01" min="0.01"></div>
      <div class="form-group"><label class="form-label">客户</label><select id="quickInCustomer" class="form-select"></select></div>
      <div class="modal-actions">
        <button id="quickInCancel" class="btn btn-outline">取消</button>
        <button id="quickInSave" class="btn btn-success">确认入库</button>
      </div>
    </div>
  </div>

  <!-- ========== 出库快捷弹窗 ========== -->
  <div id="quickOutModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-sheet">
      <h3 id="quickOutTitle">快捷出库</h3>
      <div class="form-group"><label class="form-label">数量</label><input type="number" id="quickOutQty" class="form-input" placeholder="数量" step="0.01" min="0.01"></div>
      <div class="form-group"><label class="form-label">客户</label><select id="quickOutCustomer" class="form-select"></select></div>
      <div class="modal-actions">
        <button id="quickOutCancel" class="btn btn-outline">取消</button>
        <button id="quickOutSave" class="btn btn-danger">确认出库</button>
      </div>
    </div>
  </div>

  <!-- 第三方库 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- 应用 -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
